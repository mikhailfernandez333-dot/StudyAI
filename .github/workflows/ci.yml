
name: StudyAI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pruebas:
    name: Analizar, probar y verificar calidad
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar codigo
        run: flutter analyze

      - name: Ejecutar pruebas automatizadas con cobertura
        run: flutter test --coverage

      - name: Verificar Quality Gate de cobertura
        shell: bash
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "::error::No se encontro el archivo de cobertura."
            exit 1
          fi

          RESULT=$(awk -F'[:,]' '
            /^DA:/ {
              total++
              if ($3 > 0) {
                cubiertas++
              }
            }
            END {
              if (total == 0) {
                print "0 0 0"
              } else {
                porcentaje = int((cubiertas / total) * 100)
                printf "%d %d %d\n", total, cubiertas, porcentaje
              }
            }
          ' coverage/lcov.info)

          read -r TOTAL CUBIERTAS COBERTURA <<< "$RESULT"

          echo "Lineas encontradas: $TOTAL"
          echo "Lineas cubiertas: $CUBIERTAS"
          echo "Cobertura: $COBERTURA%"

          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::No se encontraron lineas para medir."
            exit 1
          fi

          if [ "$COBERTURA" -lt 80 ]; then
            echo "::error::Quality Gate rechazado: cobertura inferior al 80%."
            exit 1
          fi

          echo "Quality Gate aprobado."
          echo "Cobertura superior al minimo requerido del 80%."
